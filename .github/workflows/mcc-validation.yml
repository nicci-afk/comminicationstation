name: MCC deterministic validation

on:
  push:
    branches:
      - "mcc-v2/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcc-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 1 + Phase 1.5 safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.75.0"

      - name: Verify Docker
        run: docker info

      - name: Run MCC deterministic validation
        run: bash scripts/validate_mcc_v2_phase1_5_local.sh

      - name: Confirm workflow is validation-only
        run: |
          echo "PASS: validation completed."
          echo "This workflow does not deploy, migrate production, seed data, or send external communication."

  phase3b:
    name: Phase 3B Focus and capture candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run test:phase3b

  phase3b-browser:
    name: Phase 3B isolated Supabase and browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: "2.75.0"
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/validate_mcc_phase3b_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3b-browser-evidence
          path: test-results/phase3b-*.png

  agentedge-safety:
    name: Gmail checkpoint and containment runtime preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.9.0"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.75.0"
      - name: Verify local runtime tools
        run: |
          docker info
          deno --version
          supabase --version
      - name: Preserve historical containment artifact checks
        run: bash scripts/validate_mcc_guard_snapshot.sh
      - name: Exact-source and mocked regression tests
        run: node --experimental-vm-modules --test tests/agentedge-safety.test.mjs tests/gmail-sync-checkpoints.test.mjs tests/mcc_sync_materializer.test.mjs
      - name: Materialize versioned checkpoint release
        run: node --experimental-vm-modules scripts/materialize_mcc_sync_release.mjs "$RUNNER_TEMP/mcc-checkpoint-bundles"
      - name: Isolated containment Edge and PostgREST preflight
        run: bash scripts/validate_mcc_agentedge_runtime.sh "$RUNNER_TEMP/mcc-checkpoint-bundles"
      - name: Isolated Gmail checkpoint Edge and PostgREST preflight
        run: bash scripts/validate_mcc_sync_runtime.sh "$RUNNER_TEMP/mcc-checkpoint-bundles"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcc-checkpoint-runtime-evidence
          path: |
            test-results/mcc-agentedge-runtime/
            test-results/mcc-sync-runtime/


