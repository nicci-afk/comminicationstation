name: MCC deterministic validation

on:
  push:
    branches:
      - "mcc-v2/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcc-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 1 + Phase 1.5 safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.75.0"

      - name: Verify Docker
        run: docker info

      - name: Run MCC deterministic validation
        run: bash scripts/validate_mcc_v2_phase1_5_local.sh

      - name: Confirm workflow is validation-only
        run: |
          echo "PASS: validation completed."
          echo "This workflow does not deploy, migrate production, seed data, or send external communication."

  phase3b:
    name: Phase 3B Focus and capture candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run test:phase3b

  phase3b-browser:
    name: Phase 3B isolated Supabase and browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: "2.75.0"
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/validate_mcc_phase3b_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3b-browser-evidence
          path: test-results/phase3b-*.png
