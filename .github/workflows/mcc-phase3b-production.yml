# LOCAL PREPARATION ONLY. Publishing/merging does not authorize a release.
# Deploy and rollback are separately fail-closed in the reviewed controller.
name: MCC Phase 3B approved production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection, or the separately authorized frontend operation
        type: choice
        options: [inspect, deploy, rollback]
        default: inspect
        required: true
      release_deployment_id:
        description: Rollback only; exact deployment ID created by this approved release
        type: string
        required: false
      confirmation:
        description: 'deploy: c3e6f4ea4cc39e15e6c3cc9bca6422d1b81f2217; rollback: dpl_G4Ju1NMyeA6VMyGWkEmmusxNpjb2'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mcc-phase3b-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Inspect or execute the explicitly approved frontend operation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed controller and execute selected operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_DEPLOYMENT_ID: ${{ inputs.release_deployment_id }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'e74edda478e1a3a8380d1fd2bbd1b81af369106eb1b9922692532173c7f85d53  scripts/mcc_frontend_release.py' | sha256sum --check --strict
          python3 scripts/mcc_frontend_release.py
