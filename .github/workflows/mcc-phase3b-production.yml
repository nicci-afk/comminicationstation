# Manual, approved exact reply-candidate frontend release; rollback remains disabled.
# No push trigger; consequential operations require exact confirmation inputs.
name: MCC Phase 3B approved production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection, or the separately authorized frontend operation
        type: choice
        options: [inspect, deploy, rollback]
        default: inspect
        required: true
      release_deployment_id:
        description: Rollback only; exact deployment ID created by this approved release
        type: string
        required: false
      confirmation:
        description: 'deploy: bc30ebfa6a414a678ffd82901bb8e76c2344d00b; rollback: not authorized'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mcc-phase3b-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Inspect or execute the explicitly approved frontend operation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed controller and execute selected operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_DEPLOYMENT_ID: ${{ inputs.release_deployment_id }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo '56e5d6084eefcec3ae1940a2601cebb9eed6d68b12e7929dbb0109d9b7a552eb  scripts/mcc_frontend_release.py' | sha256sum --check --strict
          python3 scripts/mcc_frontend_release.py
